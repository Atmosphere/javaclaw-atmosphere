plugins {
    id 'java-library'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://repo.spring.io/milestone' }
    maven { url = 'https://repo.spring.io/snapshot' }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.3"
        mavenBom "org.springframework.ai:spring-ai-bom:2.0.0-SNAPSHOT"
    }
}

dependencies {
    implementation project(':base')
    api 'org.atmosphere:atmosphere-spring-boot-starter:+'
    api 'org.atmosphere:atmosphere-agent:+'
    api 'org.atmosphere:atmosphere-a2a:+'
    api 'org.atmosphere:atmosphere-ai:+'
    api 'org.atmosphere:atmosphere-mcp:+'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework.ai:spring-ai-client-chat'
    implementation 'tools.jackson.core:jackson-databind'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
}
